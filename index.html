<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Vania Bajita ❤️</title>
  
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>❤️</text></svg>">
  
  <meta name="description" content="Vania Bajita ❤️ musiquitas y más ✨" />
  <meta property="og:title" content="Vania Bajita ❤️" />
  <meta property="og:description" content="Vania Bajita ❤️ musiquitas y más ✨" />
  <meta property="og:image" content="https://img.freepik.com/vector-gratis/tema-san-valentin-corazones-cielo-rosa_1308-38030.jpg" />

  <style>
    :root {
      --primary-color: #d63384;
      --accent-color: #ffd1dc;
      --glass-bg: rgba(255, 255, 255, 0.2); 
      --glass-border: rgba(255, 255, 255, 0.4);
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      height: 100vh;
      background: url('https://img.freepik.com/vector-gratis/tema-san-valentin-corazones-cielo-rosa_1308-38030.jpg') no-repeat center center;
      background-size: cover;
      background-attachment: fixed;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    #bg-overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(255, 255, 255, 0);
      z-index: 0;
      transition: all 1.5s ease-in-out;
      pointer-events: none;
    }

    /* Colores por canción */
    .bg-220 { background: rgba(28, 58, 138, 0.4) !important; }
    .bg-505 { background: rgba(3, 105, 161, 0.4) !important; }
    .bg-bulls { background: rgba(82, 82, 91, 0.5) !important; }
    .bg-consume { background: rgba(63, 14, 19, 0.4) !important; }
    .bg-daylight { background: linear-gradient(45deg, rgba(255, 223, 137, 0.4), rgba(255, 183, 178, 0.4)) !important; }
    .bg-eres-tu { background: rgba(167, 243, 208, 0.3) !important; }
    .bg-gimme { background: rgba(217, 70, 239, 0.3) !important; }
    .bg-her { background: rgba(232, 121, 249, 0.3) !important; }
    .bg-sorry { background: rgba(161, 161, 170, 0.4) !important; }
    .bg-love { background: rgba(249, 115, 22, 0.3) !important; }
    .bg-red { background: rgba(185, 28, 28, 0.4) !important; }
    .bg-wanna { background: rgba(55, 65, 81, 0.5) !important; }
    .bg-melting { background: rgba(254, 205, 211, 0.4) !important; }
    .bg-my-love { background: rgba(82, 82, 91, 0.4) !important; }
    .bg-nda { background: rgba(34, 197, 94, 0.3) !important; }
    .bg-out { background: rgba(134, 239, 172, 0.3) !important; }
    .bg-sienna { background: rgba(244, 114, 182, 0.3) !important; }
    .bg-sweater { background: rgba(209, 213, 219, 0.4) !important; }
    .bg-falling { background: rgba(233, 213, 255, 0.4) !important; }
    .bg-wildflower { background: rgba(163, 230, 53, 0.3) !important; }

    .glass-container {
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: var(--glass-bg);
      backdrop-filter: blur(2px); 
      -webkit-backdrop-filter: blur(2px);
      padding: 30px 40px;
      border-radius: 30px;
      border: 2px solid;
      border-image: linear-gradient(135deg, rgba(255, 255, 255, 0.6), rgba(255, 209, 220, 0.6)) 1;
      box-shadow: 0 10px 40px rgba(255, 182, 193, 0.4), 0 0 20px rgba(255, 255, 255, 0.2);
      width: 90%;
      max-width: 420px;
      text-align: center;
      animation: gentle-float 4s infinite ease-in-out;
    }

    @keyframes gentle-float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    #mensaje-central {
      font-size: 28px;
      color: #b01c64;
      font-weight: 800;
      letter-spacing: 1px;
      margin-bottom: 25px;
      text-shadow: 2px 2px 4px rgba(255,255,255,0.7);
      animation: gentle-bounce 3s infinite ease-in-out;
      cursor: pointer; 
      user-select: none;
    }

    @keyframes gentle-bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    select {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-weight: bold;
      color: var(--primary-color);
      background-color: rgba(255, 255, 255, 0.9);
      border: 2px solid white;
      border-radius: 15px;
      outline: none;
      cursor: pointer;
      margin-bottom: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      transition: all 0.3s ease;
    }

    select:hover {
      background-color: white;
      border-color: var(--accent-color);
    }

    select:focus {
      border-color: var(--primary-color);
    }

    /* Le quitamos el loop aquí para que podamos detectar cuando acaba */
    audio {
      width: 100%;
      height: 40px;
      margin-bottom: 20px;
      border-radius: 20px;
      outline: none;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .btn-revertir {
      padding: 10px 20px;
      font-size: 14px;
      font-weight: bold;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: rgba(255, 255, 255, 0.8);
      color: #333;
      border: 2px solid white;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }

    .btn-revertir:hover {
      background: var(--primary-color);
      color: white;
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(214, 51, 132, 0.4);
    }

    #bubbles-text {
      position: absolute;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
      z-index: 1; 
    }

    .text-bubble {
      position: absolute;
      font-size: 17px;
      font-weight: 600;
      color: var(--primary-color);
      background: rgba(255, 255, 255, 0.85);
      padding: 12px 25px;
      border-radius: 30px;
      backdrop-filter: blur(5px);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
      animation: floatText 9s linear forwards;
      white-space: nowrap;
      cursor: pointer; 
      pointer-events: auto; 
      user-select: none;
    }

    .music-note {
      position: absolute;
      font-size: 26px;
      text-shadow: 0 0 10px rgba(255,255,255,0.8);
      animation: floatNote 6s ease-in forwards;
      z-index: 1;
    }

    /* Animación de los Easter Eggs arreglada con Transform (caída perfecta) */
    .easter-egg-item {
      position: absolute;
      font-size: 35px; 
      top: -10%; /* Inicia fuera de la pantalla por arriba */
      text-shadow: 0 0 10px rgba(255,255,255,0.8);
      animation: fallAnimation 5s linear forwards; 
      z-index: 5;
      pointer-events: none;
    }

    @keyframes floatText {
      0% { opacity: 0; transform: scale(0.8) translateY(20px); }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { opacity: 0; transform: scale(1.1) translateY(-120px); }
    }

    @keyframes floatNote {
      0% { opacity: 0; transform: translateY(0) rotate(0deg) scale(0.5); }
      20% { opacity: 1; transform: translateY(-20px) rotate(15deg) scale(1.2); }
      80% { opacity: 1; }
      100% { opacity: 0; transform: translateY(-200px) rotate(-15deg) scale(1); }
    }

    /* Nueva animación de lluvia infalible */
    @keyframes fallAnimation {
      0% {
        opacity: 0;
        transform: translate(0, 0) rotate(0deg);
      }
      10% { opacity: 1; }
      80% { opacity: 1; }
      100% {
        opacity: 0;
        /* Viaja hacia abajo 120vh garantizando que sale de la pantalla */
        transform: translate(var(--drift), 120vh) rotate(360deg);
      }
    }
  </style>
</head>
<body>

  <div id="bg-overlay"></div>

  <div class="glass-container">
    <div id="mensaje-central">Vania, I Love You ❤️</div>

    <select id="song-selector" onchange="cambiarCancionSelect()">
      <option value="">✨ Selecciona una canción...</option>
      <option value="220">220</option>
      <option value="505">505</option>
      <option value="BULLS IN THE BRONX">BULLS IN THE BRONX</option>
      <option value="CONSUME">CONSUME</option>
      <option value="DAYLIGHT">DAYLIGHT</option>
      <option value="ERES TÚ">ERES TÚ</option>
      <option value="GIMME LOVE">GIMME LOVE</option>
      <option value="HER">HER</option>
      <option value="I LOVE YOU,I'M SORRY">I LOVE YOU, I'M SORRY</option>
      <option value="I LOVEEE">I LOVEEE</option>
      <option value="I SEE RED">I SEE RED</option>
      <option value="I WANNA BE YOUR">I WANNA BE YOUR</option>
      <option value="MELTING">MELTING</option>
      <option value="MY LOVE MINE">MY LOVE MINE</option>
      <option value="NDA">NDA</option>
      <option value="OUT OF MY LEAGUE">OUT OF MY LEAGUE</option>
      <option value="SIENNA">SIENNA</option>
      <option value="SWEATER WEATHER">SWEATER WEATHER</option>
      <option value="TIWFILFL">TIWFILFL</option>
      <option value="WILDFLOWER">WILDFLOWER</option>
    </select>

    <audio id="audio-player" controls></audio>

    <button class="btn-revertir" onclick="reiniciarVista()">Atrasito 🔙</button>
  </div>

  <div id="bubbles-text"></div>

  <script>
    const datosCanciones = {
      "220": { mp3: "220.mp3", fondoClass: "bg-220",Emojis: ["🪐", "💙", "🛸"] },
      "505": { mp3: "505.mp3", fondoClass: "bg-505",Emojis: ["🕰️", "🤍", "🎸"] },
      "BULLS IN THE BRONX": { mp3: "BULLS IN THE BRONX.mp3", fondoClass: "bg-bulls",Emojis: ["🤘", "🎸", "🖤", "🌹"] },
      "CONSUME": { mp3: "CONSUME.mp3", fondoClass: "bg-consume",Emojis: ["🌙", "🍷", "🖤", "🔥"] },
      "DAYLIGHT": { mp3: "DAYLIGHT.mp3", fondoClass: "bg-daylight",Emojis: ["☀️", "💛", "🌅"] },
      "ERES TÚ": { mp3: "ERES TÚ.mp3", fondoClass: "bg-eres-tu",Emojis: ["🌻", "💖", "🌷"] },
      "GIMME LOVE": { mp3: "GIMME LOVE.mp3", fondoClass: "bg-gimme",Emojis: ["🚀", "❤️", "💫", "🏃‍♂️"] },
      "HER": { mp3: "HER.mp3", fondoClass: "bg-her",Emojis: ["👑", "💖", "🌟"] },
      "I LOVE YOU,I'M SORRY": { mp3: "I LOVE YOU,I'M SORRY.mp3", fondoClass: "bg-sorry",Emojis: ["🥺", "🎀", "🩹"] },
      "I LOVEEE": { mp3: "I LOVEEE.mp3", fondoClass: "bg-love",Emojis: ["💖", "🔥", "😻"] },
      "I SEE RED": { mp3: "I SEE RED.mp3", fondoClass: "bg-red",Emojis: ["🔥", "🌹", "💋"] },
      "I WANNA BE YOUR": { mp3: "I WANNA BE YOUR.mp3", fondoClass: "bg-wanna",Emojis: ["🖤", "⛓️", "🎸", "🔥"] },
      "MELTING": { mp3: "MELTING.mp3", fondoClass: "bg-melting",Emojis: ["🫠", "🍦", "🤎", "🌙"] },
      "MY LOVE MINE": { mp3: "MY LOVE MINE.mp3", fondoClass: "bg-my-love",Emojis: ["🌙", "🤍", "🎹"] },
      "NDA": { mp3: "NDA.mp3", fondoClass: "bg-nda",Emojis: ["🕶️", "🖤", "🤫", "🌃"] },
      "OUT OF MY LEAGUE": { mp3: "OUT OF MY LEAGUE.mp3", fondoClass: "bg-out",Emojis: ["🕺", "💙", "🌟"] },
      "SIENNA": { mp3: "SIENNA.mp3", fondoClass: "bg-sienna",Emojis: ["🌅", "🧡", "🍸"] },
      "SWEATER WEATHER": { mp3: "SWEATER WEATHER.mp3", fondoClass: "bg-sweater",Emojis: ["🧥", "🌧️", "🖤", "🌲"] },
      "TIWFILFL": { mp3: "TIWFILFL.mp3", fondoClass: "bg-falling",Emojis: ["🎹", "💖", "⏳"] },
      "WILDFLOWER": { mp3: "WILDFLOWER.mp3", fondoClass: "bg-wildflower",Emojis: ["🌸", "🌼", "🌿", "💚"] }
    };

    const mensajes = [
      "I love you! ❤️",
      "Gracias por ser como eres 🌟",
      "Eres mi dele favorita 💕",
      "Nunca cambies 🥰",
      "Te adoro 💖",
      "You are the best 😍",
      "Me encanta tu sonrisa 🤩",
      "Vania bajita 💘",
      "Siempre juntos ✨",
      "Gracias por enseñarme APA 💭",
      "Gracias por no fallarme amiga💫",
      "No me caes tan mal xd 👻"
    ];

    let isPlayingMusic = false;
    const baseEmojis = ["🎵", "🎶", "✨", "❤️"]; 
    let currentEmojis = [...baseEmojis]; 
    const fraseFija = "iloveyoualotsoverymuch";

    // Efecto Máquina de escribir
    function typeWriterEffect(text, elementId) {
      const element = document.getElementById(elementId);
      element.innerHTML = ""; 
      let i = 0;
      function type() {
        if (i < text.length) {
          element.innerHTML += text.charAt(i);
          i++;
          setTimeout(type, 100); 
        } else {
          element.innerHTML = text; 
        }
      }
      type();
    }

    // Lluvia infalible arreglada
    function lluviaDeItemEasterEgg(itemsArray) {
      const numItems = 60; 
      
      for (let i = 0; i < numItems; i++) {
        setTimeout(() => {
          const item = document.createElement("div");
          item.className = "easter-egg-item";
          item.innerText = itemsArray[Math.floor(Math.random() * itemsArray.length)];
          
          item.style.left = (Math.random() * 95) + "vw";
          
          // Calculamos el viento para que caiga en diagonal a veces
          const drift = (Math.random() * 20 - 10) + "vw"; 
          item.style.setProperty('--drift', drift);
          
          document.getElementById("bubbles-text").appendChild(item);
          setTimeout(() => item.remove(), 5500); 
        }, i * 50); 
      }
    }

    // Easter Egg 2
    let burbujasVaniaBajitaClickeadas = 0;
    function registrarClicBurbuja(text, bubbleElement) {
      if (text === "Vania bajita 👑") {
        burbujasVaniaBajitaClickeadas++;
        bubbleElement.style.border = "3px solid #b01c64"; 
        
        if (burbujasVaniaBajitaClickeadas === 4) {
          lluviaDeItemEasterEgg(["❤️", "💖", "✨", "⭐", "🌟"]); 
          burbujasVaniaBajitaClickeadas = 0; 
        }
      }
    }

    function createTextBubble() {
      const bubble = document.createElement("div");
      bubble.className = "text-bubble";
      const randomText = mensajes[Math.floor(Math.random() * mensajes.length)];
      bubble.innerText = randomText;
      
      bubble.onclick = () => registrarClicBurbuja(randomText, bubble);

      bubble.style.left = (Math.random() * 80 + 5) + "vw";
      bubble.style.top = (Math.random() * 80 + 10) + "vh"; 

      document.getElementById("bubbles-text").appendChild(bubble);
      setTimeout(() => bubble.remove(), 9000);
    }

    function createMusicNote() {
      if (!isPlayingMusic) return;
      const note = document.createElement("div");
      note.className = "music-note";
      note.innerText = currentEmojis[Math.floor(Math.random() * currentEmojis.length)];
      note.style.left = (Math.random() * 80 + 5) + "vw";
      note.style.top = (Math.random() * 20 + 80) + "vh"; 
      document.getElementById("bubbles-text").appendChild(note);
      setTimeout(() => note.remove(), 6000);
    }

    // Easter Egg 1
    let tituloClics = 0;
    const mensajeCentral = document.getElementById("mensaje-central");
    mensajeCentral.onclick = () => {
      tituloClics++;
      if (tituloClics === 5) {
        lluviaDeItemEasterEgg(["👻", "💀", "👻"]); 
        tituloClics = 0; 
      }
    };

    setInterval(createTextBubble, 1500);
    setInterval(createMusicNote, 600); 

    function cambiarCancionSelect() {
      const selector = document.getElementById("song-selector");
      const cancionElegida = selector.value;
      if (!cancionElegida) {
        reiniciarVista();
        return;
      }
      
      const info = datosCanciones[cancionElegida];
      const audio = document.getElementById("audio-player");
      const overlay = document.getElementById("bg-overlay");
      
      audio.src = info.mp3;
      audio.play();
      isPlayingMusic = true;

      typeWriterEffect(fraseFija, "mensaje-central");

      overlay.className = ""; 
      overlay.classList.add(info.fondoClass);

      currentEmojis = info.Emojis.concat(baseEmojis);
      
      burbujasVaniaBajitaClickeadas = 0;
      tituloClics = 0;
    }

    function reiniciarVista() {
      const audio = document.getElementById("audio-player");
      const overlay = document.getElementById("bg-overlay");
      const mensajeCentral = document.getElementById("mensaje-central");
      const selector = document.getElementById("song-selector");

      audio.pause();
      audio.src = "";
      isPlayingMusic = false;
      selector.value = ""; 

      mensajeCentral.innerText = "Vania, I Love You ❤️";
      overlay.className = ""; 
      currentEmojis = [...baseEmojis];
      
      burbujasVaniaBajitaClickeadas = 0;
      tituloClics = 0;
    }

    // EVENTO AUTOMÁTICO PARA PASAR A LA SIGUIENTE CANCIÓN
    document.getElementById("audio-player").addEventListener("ended", function() {
      const selector = document.getElementById("song-selector");
      
      // Si no es la última canción de la lista, pasa a la siguiente
      if (selector.selectedIndex < selector.options.length - 1) {
        selector.selectedIndex++;
      } else {
        // Si es la última, vuelve a la primera canción (índice 1, saltando el placeholder)
        selector.selectedIndex = 1; 
      }
      
      // Ejecuta la función de cambiar canción
      cambiarCancionSelect();
    });

  </script>
</body>
</html>
