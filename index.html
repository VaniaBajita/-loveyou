<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Vania Bajita ❤️</title>

  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>❤️</text></svg>">

  <meta name="description" content="Vania Bajita ❤️ musiquitas y más ✨" />
  <meta property="og:title" content="Vania Bajita ❤️" />
  <meta property="og:description" content="Vania Bajita ❤️ musiquitas y más ✨" />
  <meta property="og:image" content="https://img.freepik.com/vector-gratis/tema-san-valentin-corazones-cielo-rosa_1308-38030.jpg" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #d63384;
      --primary-dark: #b01c64;
      --primary-light: #ff7eb3;
      --accent: #ffd1dc;
      --text-deep: #4a1d3a;

      --glass-bg: rgba(255, 255, 255, 0.18);
      --glass-bg-hover: rgba(255, 255, 255, 0.26);
      --glass-border: rgba(255, 255, 255, 0.45);
      --glass-shadow:
        0 20px 60px -10px rgba(214, 51, 132, 0.35),
        0 0 0 1px rgba(255, 255, 255, 0.15) inset,
        0 1px 0 rgba(255, 255, 255, 0.6) inset;
      --glass-shadow-hover:
        0 30px 80px -10px rgba(214, 51, 132, 0.55),
        0 0 0 1px rgba(255, 255, 255, 0.25) inset,
        0 1px 0 rgba(255, 255, 255, 0.8) inset;

      --ease: cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body { margin: 0; padding: 0; height: 100%; }

    body {
      font-family: 'Poppins', 'Quicksand', sans-serif;
      min-height: 100vh;
      background: url('https://img.freepik.com/vector-gratis/tema-san-valentin-corazones-cielo-rosa_1308-38030.jpg') no-repeat center center fixed;
      background-size: cover;
      overflow: hidden;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: var(--text-deep);
    }

    /* Two crossfade overlays (smooth color transition between songs) */
    .bg-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      opacity: 0;
      transition: opacity 1.6s var(--ease);
    }
    .bg-overlay.active { opacity: 1; }

    .bg-220       { background: linear-gradient(135deg, rgba(28, 58, 138, .55), rgba(67, 56, 202, .45)); }
    .bg-505       { background: linear-gradient(135deg, rgba(3, 105, 161, .55), rgba(14, 165, 233, .45)); }
    .bg-bulls     { background: linear-gradient(135deg, rgba(82, 82, 91, .60), rgba(24, 24, 27, .55)); }
    .bg-consume   { background: linear-gradient(135deg, rgba(63, 14, 19, .60), rgba(127, 29, 29, .50)); }
    .bg-daylight  { background: linear-gradient(135deg, rgba(255, 223, 137, .55), rgba(255, 183, 178, .55)); }
    .bg-eres-tu   { background: linear-gradient(135deg, rgba(167, 243, 208, .50), rgba(110, 231, 183, .45)); }
    .bg-gimme     { background: linear-gradient(135deg, rgba(217, 70, 239, .50), rgba(232, 121, 249, .45)); }
    .bg-her       { background: linear-gradient(135deg, rgba(232, 121, 249, .50), rgba(244, 114, 182, .45)); }
    .bg-sorry     { background: linear-gradient(135deg, rgba(161, 161, 170, .55), rgba(212, 212, 216, .50)); }
    .bg-love      { background: linear-gradient(135deg, rgba(249, 115, 22, .50), rgba(251, 146, 60, .45)); }
    .bg-red       { background: linear-gradient(135deg, rgba(185, 28, 28, .55), rgba(220, 38, 38, .50)); }
    .bg-wanna     { background: linear-gradient(135deg, rgba(55, 65, 81, .60), rgba(31, 41, 55, .55)); }
    .bg-melting   { background: linear-gradient(135deg, rgba(254, 205, 211, .55), rgba(251, 207, 232, .50)); }
    .bg-my-love   { background: linear-gradient(135deg, rgba(82, 82, 91, .55), rgba(63, 63, 70, .50)); }
    .bg-nda       { background: linear-gradient(135deg, rgba(34, 197, 94, .50), rgba(22, 163, 74, .45)); }
    .bg-out       { background: linear-gradient(135deg, rgba(134, 239, 172, .50), rgba(74, 222, 128, .45)); }
    .bg-sienna    { background: linear-gradient(135deg, rgba(244, 114, 182, .50), rgba(236, 72, 153, .45)); }
    .bg-sweater   { background: linear-gradient(135deg, rgba(209, 213, 219, .55), rgba(156, 163, 175, .50)); }
    .bg-falling   { background: linear-gradient(135deg, rgba(233, 213, 255, .55), rgba(216, 180, 254, .50)); }
    .bg-wildflower{ background: linear-gradient(135deg, rgba(163, 230, 53, .50), rgba(190, 242, 100, .45)); }

    /* Canvas particles (performant emoji rain / float) */
    #particles-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }

    /* Floating bubble layer (interactive — DOM kept) */
    #bubbles-text {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 2;
    }

    /* ===== GLASS CONTAINER ===== */
    .glass-container {
      position: relative;
      z-index: 3;
      display: flex;
      flex-direction: column;
      gap: 18px;
      width: min(440px, 92vw);
      padding: 30px 26px 24px;
      background: var(--glass-bg);
      backdrop-filter: blur(22px) saturate(180%);
      -webkit-backdrop-filter: blur(22px) saturate(180%);
      border: 1px solid var(--glass-border);
      border-radius: 28px;
      box-shadow: var(--glass-shadow);
      text-align: center;
      transition: transform .5s var(--ease), box-shadow .5s var(--ease), background .5s var(--ease);
      animation: gentle-float 6s infinite ease-in-out;
    }

    .glass-container::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 28px;
      padding: 1px;
      background: linear-gradient(135deg, rgba(255,255,255,.7), rgba(255,255,255,.05) 40%, rgba(255,209,220,.5));
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
              mask-composite: exclude;
      pointer-events: none;
    }

    .glass-container:hover {
      box-shadow: var(--glass-shadow-hover);
      background: var(--glass-bg-hover);
    }

    @keyframes gentle-float {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-6px); }
    }

    /* ===== TITLE ===== */
    #mensaje-central {
      font-family: 'Poppins', sans-serif;
      font-size: clamp(22px, 5.2vw, 30px);
      color: var(--primary-dark);
      font-weight: 700;
      letter-spacing: 0.5px;
      margin: 0 0 4px;
      text-shadow: 0 2px 14px rgba(255, 255, 255, .65);
      cursor: pointer;
      user-select: none;
      transition: transform .3s var(--ease), text-shadow .3s var(--ease);
      animation: gentle-bounce 4s infinite ease-in-out;
      min-height: 1.2em;
      word-break: break-word;
    }

    #mensaje-central:hover {
      transform: scale(1.04);
      text-shadow: 0 2px 22px rgba(255, 255, 255, .9), 0 0 18px rgba(214, 51, 132, .25);
    }

    @keyframes gentle-bounce {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-8px); }
    }

    /* ===== SELECT ===== */
    .select-wrapper { position: relative; }

    .select-wrapper::after {
      content: '▾';
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: var(--primary);
      font-size: 14px;
      font-weight: 700;
    }

    select#song-selector {
      width: 100%;
      padding: 13px 38px 13px 18px;
      font-family: 'Poppins', sans-serif;
      font-size: 14px;
      font-weight: 600;
      color: var(--primary-dark);
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 14px;
      outline: none;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;
      box-shadow: 0 4px 14px rgba(214, 51, 132, .12);
      transition: all .3s var(--ease);
    }

    select#song-selector:hover {
      background: rgba(255, 255, 255, 0.96);
      transform: translateY(-1px);
      box-shadow: 0 8px 22px rgba(214, 51, 132, .22);
    }

    select#song-selector:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(214, 51, 132, .18);
    }

    /* ===== CUSTOM PLAYER ===== */
    .player {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 14px 14px 12px;
      background: rgba(255, 255, 255, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 18px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .track-info {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 22px;
    }

    .track-title {
      flex: 1;
      text-align: left;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--primary-dark);
      letter-spacing: 0.6px;
      text-transform: uppercase;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      opacity: 0.9;
    }

    .visualizer {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 18px;
      width: 38px;
      flex-shrink: 0;
    }

    .visualizer span {
      flex: 1;
      background: linear-gradient(to top, var(--primary), var(--primary-light));
      border-radius: 2px;
      transform-origin: bottom;
      transform: scaleY(0.18);
      transition: transform .12s ease-out;
      box-shadow: 0 0 4px rgba(214, 51, 132, .35);
    }

    .progress-area {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .progress-bar {
      position: relative;
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.5);
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 1px 3px rgba(0,0,0,.06) inset;
    }

    .progress-fill {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--primary), var(--primary-light));
      border-radius: 999px;
      transition: width .12s linear;
      box-shadow: 0 0 8px rgba(214, 51, 132, .45);
    }

    .progress-thumb {
      position: absolute;
      top: 50%;
      left: 0%;
      width: 14px;
      height: 14px;
      background: white;
      border: 2px solid var(--primary);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 2px 8px rgba(214, 51, 132, .4);
      opacity: 0;
      transition: opacity .25s ease;
      pointer-events: none;
    }

    .progress-bar:hover .progress-thumb,
    .progress-bar.scrubbing .progress-thumb { opacity: 1; }

    .time-row {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 500;
      color: var(--primary-dark);
      opacity: 0.85;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.3px;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 4px 0 2px;
    }

    .ctrl-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 42px;
      border: none;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.65);
      color: var(--primary-dark);
      cursor: pointer;
      padding: 0;
      transition: all .3s var(--ease);
      box-shadow: 0 2px 8px rgba(0, 0, 0, .08);
    }

    .ctrl-btn svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
      pointer-events: none;
    }

    .ctrl-btn:hover {
      background: white;
      transform: translateY(-3px) scale(1.08);
      box-shadow: 0 8px 22px rgba(214, 51, 132, .35);
      color: var(--primary);
    }

    .ctrl-btn:active { transform: translateY(0) scale(0.95); }

    .ctrl-btn.play {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: white;
      box-shadow: 0 8px 22px rgba(214, 51, 132, .45);
    }

    .ctrl-btn.play svg { width: 22px; height: 22px; }

    .ctrl-btn.play:hover {
      transform: translateY(-3px) scale(1.06);
      box-shadow: 0 12px 32px rgba(214, 51, 132, .6);
      color: white;
      background: linear-gradient(135deg, var(--primary-light), var(--primary));
    }

    /* ===== BACK BUTTON ===== */
    .btn-revertir {
      align-self: center;
      margin-top: 4px;
      padding: 10px 24px;
      font-family: 'Poppins', sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.4px;
      background: rgba(255, 255, 255, 0.75);
      color: var(--text-deep);
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(0, 0, 0, .07);
      transition: all .3s var(--ease);
    }

    .btn-revertir:hover {
      background: var(--primary);
      color: white;
      transform: translateY(-2px);
      box-shadow: 0 10px 26px rgba(214, 51, 132, .5);
    }

    /* Hide native audio element completely */
    audio { display: none !important; }

    /* ===== FLOATING TEXT BUBBLES ===== */
    .text-bubble {
      position: absolute;
      font-family: 'Poppins', sans-serif;
      font-size: clamp(12px, 2.5vw, 16px);
      font-weight: 600;
      color: var(--primary-dark);
      background: rgba(255, 255, 255, 0.88);
      padding: 10px 22px;
      border-radius: 999px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow:
        0 6px 18px rgba(214, 51, 132, .15),
        0 0 0 1px rgba(255, 255, 255, .55) inset;
      animation: floatText 9s linear forwards;
      white-space: nowrap;
      cursor: pointer;
      pointer-events: auto;
      user-select: none;
      transition: transform .25s var(--ease), box-shadow .25s var(--ease);
    }

    .text-bubble:hover {
      transform: scale(1.1) translateY(-4px);
      box-shadow:
        0 12px 30px rgba(214, 51, 132, .35),
        0 0 0 1px rgba(255, 255, 255, .85) inset,
        0 0 22px rgba(255, 209, 220, .6);
    }

    @keyframes floatText {
      0%   { opacity: 0; transform: scale(.85) translateY(20px); }
      10%  { opacity: 1; }
      90%  { opacity: 1; }
      100% { opacity: 0; transform: scale(1.05) translateY(-100px); }
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 480px) {
      body { padding: 12px; }
      .glass-container {
        padding: 24px 18px 20px;
        gap: 14px;
        border-radius: 24px;
      }
      .ctrl-btn { width: 38px; height: 38px; }
      .ctrl-btn.play { width: 50px; height: 50px; }
      .controls { gap: 14px; }
      .text-bubble { padding: 8px 16px; }
      .player { padding: 12px 10px 10px; }
    }

    @media (max-height: 620px) {
      .glass-container { padding: 20px 22px; gap: 12px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .glass-container,
      #mensaje-central { animation: none; }
      .bg-overlay { transition-duration: .4s; }
    }
  </style>
</head>

        </button>
        <button class="ctrl-btn" id="btn-next" aria-label="Siguiente canción" title="Siguiente">
          <svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2V6zM6 18l8.5-6L6 6v12z"/></svg>
        </button>
      </div>
    </div>

    <button class="btn-revertir" id="btn-revertir">Atrasito 🔙</button>

    <audio id="audio-player" preload="metadata"></audio>
  </main>

  <div id="bubbles-text"></div>

  <script>

    const mensajes = [
      "I love you! ❤️",
      "Gracias por ser como eres 🌟",
      "Eres mi dele favorita 💕",
      "Nunca cambies 🥰",
      "sunshine 💖",
      "You are the best 😍",
      "Me encanta tu sonrisa 🤩",
      "Vania bajita 👑",
      "Siempre juntos ✨",
      "Gracias por enseñarme APA 💭",
      "Gracias por no fallarme amiga💫",
      "No me caes tan mal xd 👻"
    ];

    const baseEmojis = ["🎵","🎶","✨","❤️"];
    const fraseFija = "iloveyoualotsoverymuch";
    const songKeys = Object.keys(datosCanciones);

    // ===== STATE =====
    let currentEmojis  = [...baseEmojis];
    let isPlayingMusic = false;
    let burbujasVaniaClicks = 0;
    let tituloClics = 0;
    let typewriterTimer = null;

    // ===== DOM =====
    const $ = (id) => document.getElementById(id);
    const audio        = $('audio-player');
    const selector     = $('song-selector');
    const titulo       = $('mensaje-central');
    const overlayA     = $('bg-overlay-a');
    const overlayB     = $('bg-overlay-b');
    const trackTitle   = $('track-title');
    const timeCurrent  = $('time-current');
    const timeTotal    = $('time-total');
    const progressBar  = $('progress-bar');
    const progressFill = $('progress-fill');
    const progressThumb= $('progress-thumb');
    const btnPlay      = $('btn-play');
    const btnPrev      = $('btn-prev');
    const btnNext      = $('btn-next');
    const btnRevertir  = $('btn-revertir');
    const iconPlay     = $('icon-play');
    const visualizer   = $('visualizer');
    const visualizerBars = visualizer.querySelectorAll('span');
    const bubblesContainer = $('bubbles-text');

    // ===== BACKGROUND CROSSFADE =====
    let activeOverlay   = overlayA;
    let inactiveOverlay = overlayB;

    function setBackgroundClass(className) {
      inactiveOverlay.className = 'bg-overlay';
      if (className) inactiveOverlay.classList.add(className);
      requestAnimationFrame(() => {
        inactiveOverlay.classList.add('active');
        activeOverlay.classList.remove('active');
        const tmp = activeOverlay;
        activeOverlay = inactiveOverlay;
        inactiveOverlay = tmp;
      });
    }

    // ===== TYPEWRITER =====
    function typeWriterEffect(text, element) {
      if (typewriterTimer) clearTimeout(typewriterTimer);
      element.textContent = '';
      let i = 0;
      (function step() {
        if (i < text.length) {
          element.textContent += text.charAt(i++);
          typewriterTimer = setTimeout(step, 90);
        }
      })();
    }

    // ===== TIME FORMAT =====
    function formatTime(s) {
      if (!isFinite(s) || s < 0) return '0:00';
      const m = Math.floor(s / 60);
      const sec = Math.floor(s % 60).toString().padStart(2, '0');
      return `${m}:${sec}`;
    }

    // ===== CANVAS PARTICLES =====
    const canvas = $('particles-canvas');
    const ctx = canvas.getContext('2d');
    const particles = [];
    const easterRain = [];
    let dpr = Math.min(window.devicePixelRatio || 1, 2);

    function resizeCanvas() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width  = window.innerWidth  * dpr;
      canvas.height = window.innerHeight * dpr;
      canvas.style.width  = window.innerWidth + 'px';
      canvas.style.height = window.innerHeight + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    function spawnParticle() {
      if (!isPlayingMusic) return;
      if (particles.length > 45) return;
      const W = window.innerWidth;
      const H = window.innerHeight;
      particles.push({
        emoji: currentEmojis[Math.floor(Math.random() * currentEmojis.length)],
        x: Math.random() * W,
        y: H + 20,
        vx: (Math.random() - 0.5) * 0.6,
        vy: -(0.6 + Math.random() * 1.4),
        size: 22 + Math.random() * 12,
        rot: (Math.random() - 0.5) * 0.4,
        rotation: (Math.random() - 0.5) * 0.6,
        life: 0,
        ttl: 360 + Math.random() * 180,
      });
    }

    function spawnEasterRain(items, total = 60) {
      const W = window.innerWidth;
      let spawned = 0;
      const intervalMs = 50;
      const id = setInterval(() => {
        if (spawned >= total) { clearInterval(id); return; }
        easterRain.push({
          emoji: items[Math.floor(Math.random() * items.length)],
          x: Math.random() * W,
          y: -30 - Math.random() * 80,
          vx: (Math.random() - 0.5) * 1.6,
          vy: 3 + Math.random() * 3,
          size: 28 + Math.random() * 14,
          rot: (Math.random() - 0.5) * 0.18,
          rotation: 0,
        });
        spawned++;
      }, intervalMs);
    }

    function tickCanvas() {
      const W = window.innerWidth;
      const H = window.innerHeight;
      ctx.clearRect(0, 0, W, H);

      // Music notes (rising)
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.rotation += p.rot * 0.04;
        p.life++;

        let alpha = 1;
        if (p.life < 30) alpha = p.life / 30;
        else if (p.life > p.ttl - 60) alpha = Math.max(0, (p.ttl - p.life) / 60);

        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rotation);
        ctx.font = `${p.size}px serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(p.emoji, 0, 0);
        ctx.restore();

        if (p.life > p.ttl || p.y < -50) particles.splice(i, 1);
      }

      // Easter rain (falling)
      for (let i = easterRain.length - 1; i >= 0; i--) {
        const p = easterRain[i];
        p.x += p.vx;
        p.y += p.vy;
        p.rotation += p.rot;

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rotation);
        ctx.font = `${p.size}px serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(p.emoji, 0, 0);
        ctx.restore();

        if (p.y > H + 50) easterRain.splice(i, 1);
      }

      requestAnimationFrame(tickCanvas);
    }
    requestAnimationFrame(tickCanvas);

    // Spawn loop for music notes
    let lastSpawn = 0;
    function spawnLoop(ts) {
      if (ts - lastSpawn > 280) {
        spawnParticle();
        lastSpawn = ts;
      }
      requestAnimationFrame(spawnLoop);
    }
    requestAnimationFrame(spawnLoop);

    // ===== TEXT BUBBLES =====
    function createTextBubble() {
      if (document.hidden) return;
      if (bubblesContainer.querySelectorAll('.text-bubble').length > 7) return;

      const bubble = document.createElement('div');
      bubble.className = 'text-bubble';
      const text = mensajes[Math.floor(Math.random() * mensajes.length)];
      bubble.textContent = text;
      bubble.style.left = (Math.random() * 70 + 10) + 'vw';
      bubble.style.top  = (Math.random() * 65 + 18) + 'vh';
      bubble.addEventListener('click', () => registrarClicBurbuja(text, bubble));
      bubblesContainer.appendChild(bubble);
      setTimeout(() => bubble.remove(), 9000);
    }

    function registrarClicBurbuja(text, el) {
      if (text === 'Vania bajita 👑') {
        burbujasVaniaClicks++;
        el.style.border = '3px solid #b01c64';
        el.style.boxShadow = '0 0 22px rgba(214, 51, 132, .55), 0 0 0 1px rgba(255,255,255,.85) inset';
        if (burbujasVaniaClicks >= 4) {
          spawnEasterRain(['❤️','💖','✨','⭐','🌟'], 70);
          burbujasVaniaClicks = 0;
        }
      }
    }

    setInterval(createTextBubble, 1800);

    // ===== PLAYER LOGIC =====
    function loadSong(key, autoplay = true) {
      const info = datosCanciones[key];
      if (!info) return;
      audio.src = info.mp3;
      selector.value = key;
      trackTitle.textContent = key;
      setBackgroundClass(info.fondoClass);
      currentEmojis = info.emojis.concat(baseEmojis);
      typeWriterEffect(fraseFija, titulo);
      burbujasVaniaClicks = 0;
      tituloClics = 0;
      if (autoplay) audio.play().catch(() => {});
    }

    function togglePlay() {
      if (!audio.src) { loadSong(songKeys[0]); return; }
      if (audio.paused) audio.play().catch(() => {});
      else audio.pause();
    }

    function nextSong() {
      const idx = songKeys.indexOf(selector.value);
      const next = idx === -1 ? 0 : (idx + 1) % songKeys.length;
      loadSong(songKeys[next]);
    }

    function prevSong() {
      const idx = songKeys.indexOf(selector.value);
      const prev = idx === -1 ? songKeys.length - 1 : (idx - 1 + songKeys.length) % songKeys.length;
      loadSong(songKeys[prev]);
    }

    function reiniciarVista() {
      audio.pause();
      audio.removeAttribute('src');
      audio.load();
      isPlayingMusic = false;
      selector.value = '';
      if (typewriterTimer) clearTimeout(typewriterTimer);
      titulo.textContent = 'Vania, I Love You ❤️';
      setBackgroundClass('');
      currentEmojis = [...baseEmojis];
      burbujasVaniaClicks = 0;
      tituloClics = 0;
      trackTitle.textContent = '— sin canción —';
      timeCurrent.textContent = '0:00';
      timeTotal.textContent = '0:00';
      progressFill.style.width = '0%';
      progressThumb.style.left = '0%';
      setPlayIcon(false);
    }

    function setPlayIcon(playing) {
      iconPlay.innerHTML = playing
        ? '<path d="M6 5h4v14H6V5zm8 0h4v14h-4V5z"/>'
        : '<path d="M8 5v14l11-7L8 5z"/>';
    }

    // ===== AUDIO EVENTS =====
    audio.addEventListener('play',  () => { isPlayingMusic = true;  setPlayIcon(true);  });
    audio.addEventListener('pause', () => { isPlayingMusic = false; setPlayIcon(false); });
    audio.addEventListener('ended', () => { nextSong(); });
    audio.addEventListener('loadedmetadata', () => {
      timeTotal.textContent = formatTime(audio.duration);
    });
    audio.addEventListener('timeupdate', () => {
      if (!audio.duration) return;
      const pct = (audio.currentTime / audio.duration) * 100;
      progressFill.style.width = pct + '%';
      progressThumb.style.left = pct + '%';
      timeCurrent.textContent = formatTime(audio.currentTime);
    });

    // ===== PROGRESS BAR SCRUBBING =====
    let isScrubbing = false;
    function seekFromEvent(e) {
      const rect = progressBar.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const pct = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
      if (audio.duration) audio.currentTime = pct * audio.duration;
      progressFill.style.width = (pct * 100) + '%';
      progressThumb.style.left = (pct * 100) + '%';
    }
    progressBar.addEventListener('mousedown', (e) => {
      isScrubbing = true;
      progressBar.classList.add('scrubbing');
      seekFromEvent(e);
    });
    document.addEventListener('mousemove', (e) => { if (isScrubbing) seekFromEvent(e); });
    document.addEventListener('mouseup',   () => {
      if (isScrubbing) { isScrubbing = false; progressBar.classList.remove('scrubbing'); }
    });
    progressBar.addEventListener('touchstart', (e) => {
      isScrubbing = true; progressBar.classList.add('scrubbing'); seekFromEvent(e);
    }, { passive: true });
    document.addEventListener('touchmove', (e) => { if (isScrubbing) seekFromEvent(e); }, { passive: true });
    document.addEventListener('touchend',  () => {
      if (isScrubbing) { isScrubbing = false; progressBar.classList.remove('scrubbing'); }
    });

    // ===== CONTROLS =====
    btnPlay.addEventListener('click', togglePlay);
    btnNext.addEventListener('click', nextSong);
    btnPrev.addEventListener('click', prevSong);
    btnRevertir.addEventListener('click', reiniciarVista);
    selector.addEventListener('change', () => {
      const v = selector.value;
      if (!v) { reiniciarVista(); return; }
      loadSong(v);
    });

    // ===== EASTER EGG 1 (title) =====
    titulo.addEventListener('click', () => {
      tituloClics++;
      if (tituloClics >= 5) {
        spawnEasterRain(['👻','💀','👻'], 60);
        tituloClics = 0;
      }
    });

    // ===== KEYBOARD SHORTCUTS =====
    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return;
      if (e.code === 'Space')      { e.preventDefault(); togglePlay(); }
      if (e.code === 'ArrowRight') { nextSong(); }
      if (e.code === 'ArrowLeft')  { prevSong(); }
    });

    // ===== VISUALIZER (smooth synthetic motion while playing) =====
    function animateVisualizer() {
      if (isPlayingMusic) {
        const t = performance.now();
        visualizerBars.forEach((bar, i) => {
          const phase = t / (180 + i * 55);
          const v = (Math.sin(phase) + Math.sin(phase * 1.7 + i)) / 2;
          const scale = 0.22 + Math.abs(v) * 0.78;
          bar.style.transform = `scaleY(${scale.toFixed(3)})`;
        });
      } else {
        visualizerBars.forEach(bar => bar.style.transform = 'scaleY(0.18)');
      }
      requestAnimationFrame(animateVisualizer);
    }
    requestAnimationFrame(animateVisualizer);
  })();
  </script>
</body>
</html>
