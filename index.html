<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vania Bajita ❤️</title>
  <meta name="theme-color" content="#fbcfe8" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>❤️</text></svg>" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet"
  />

  <style>
    /* =========================================================================
       1. TOKENS
       Las cuatro variables de color (--c-from / --c-to / --c-accent / --c-glow)
       las reescribe el JS en cada canción, con la paleta de esa canción.
       ========================================================================= */
    :root {
      --c-from:   #fbcfe8;
      --c-to:     #f472b6;
      --c-accent: #be185d;
      --c-glow:   #ec4899;

      --c-ink:    #2d0a1f;
      --c-mute:   rgba(45, 10, 31, .65);
      --c-bg:     #ffe4ef;
      --c-text:   #4a0a1f;
      --c-text-2: #8b0024;

      --ease:     cubic-bezier(.4, 0, .2, 1);
      --ease-out: cubic-bezier(.16, 1, .3, 1);
      --t: .6s;
    }

    /* =========================================================================
       2. BASE
       ========================================================================= */
    *,
    *:before,
    *:after {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      font-family: Inter, system-ui, sans-serif;
      color: var(--c-ink);
      background: var(--c-bg);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    body {
      background:
        radial-gradient(ellipse at 20% 10%, color-mix(in srgb, var(--c-from) 88%, transparent) 0%, transparent 65%),
        radial-gradient(ellipse at 80% 90%, color-mix(in srgb, var(--c-glow) 82%, transparent) 0%, transparent 65%),
        radial-gradient(ellipse at 50% 50%, color-mix(in srgb, var(--c-accent) 35%, transparent) 0%, transparent 85%),
        url(https://img.freepik.com/vector-gratis/tema-san-valentin-corazones-cielo-rosa_1308-38030.jpg) center / cover no-repeat fixed,
        var(--c-bg);
      transition: background .8s var(--ease);
    }

    button {
      font-family: inherit;
      cursor: pointer;
    }

    /* =========================================================================
       3. TARJETA PRINCIPAL
       ========================================================================= */
    .stage {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 20px;
    }

    .card {
      width: 100%;
      max-width: 440px;
      padding: clamp(22px, 3.2vw, 32px);
      border-radius: 28px;
      background: #fffcfeeb;
      border: 1px solid rgba(255, 255, 255, .95);
      box-shadow:
        0 30px 80px -20px #be185d66,
        0 2px 8px #be185d26;
      text-align: center;
      position: relative;
      z-index: 2;
    }

    .card__eyebrow {
      font-size: 10px;
      letter-spacing: .4em;
      text-transform: uppercase;
      color: var(--c-mute);
      margin: 0 0 .8rem;
    }

    .card__title {
      font-family: "Cormorant Garamond", serif;
      font-style: normal;
      font-weight: 600;
      font-size: clamp(22px, 5.5vw, 36px);
      line-height: 1.1;
      margin: 0;
      color: var(--c-text-2);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: clip;
      letter-spacing: -.01em;
    }

    .heart {
      display: inline-block;
    }

    .card__sub {
      margin: .6rem 0 1.6rem;
      color: var(--c-mute);
      font-style: italic;
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(13px, 1.6vw, 16px);
    }

    /* =========================================================================
       4. NOW PLAYING
       ========================================================================= */
    .now {
      margin-bottom: 1.4rem;
    }

    .now__cover {
      font-size: clamp(64px, 12vw, 92px);
      line-height: 1;
      margin: 0 0 .4rem;
      filter: drop-shadow(0 6px 18px color-mix(in srgb, var(--c-glow) 40%, transparent));
      transition: transform .4s var(--ease-out);
      user-select: none;
    }

    .now.is-playing .now__cover {
      animation: nowPulse 3.5s ease-in-out infinite;
    }

    @keyframes nowPulse {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.08); }
    }

    .now__title {
      font-family: "Cormorant Garamond", serif;
      font-style: normal;
      font-weight: 600;
      font-size: clamp(24px, 2.8vw, 30px);
      margin: 0;
      color: var(--c-text);
      line-height: 1.2;
    }

    .now__artist {
      font-size: 10px;
      letter-spacing: .25em;
      text-transform: uppercase;
      margin: 6px 0 0;
      color: var(--c-mute);
    }

    /* =========================================================================
       5. CONTROLES DEL REPRODUCTOR
       ========================================================================= */
    .player {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: .9rem;
    }

    .player__btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--c-text);
      font-size: 28px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .18s var(--ease);
    }

    .player__btn:hover {
      background: #4a0a1f1a;
    }

    .player__btn--play {
      width: 54px;
      height: 54px;
      background: var(--c-text-2);
      color: #fff;
      font-size: 18px;
      padding-left: 3px;
      box-shadow: 0 8px 20px -6px #4a0a1f73;
    }

    .player__btn--play:hover {
      background: var(--c-text);
    }

    /* Zona táctil generosa alrededor de una barra que solo mide 4px. */
    .player__scrub {
      padding: 9px 0;
      cursor: pointer;
      touch-action: none;
    }

    .player__bar {
      width: 100%;
      height: 4px;
      background: #4a0a1f2e;
      border-radius: 999px;
      overflow: hidden;
      transition: height .15s var(--ease);
    }

    .player__scrub:hover .player__bar,
    .player__scrub.is-scrubbing .player__bar {
      height: 7px;
    }

    .player__fill {
      height: 100%;
      background: var(--c-text-2);
      width: 0%;
      transition: width .12s linear;
    }

    /* Al arrastrar manda el dedo, no la interpolación. */
    .player__scrub.is-scrubbing .player__fill {
      transition: none;
    }

    .player__times {
      display: flex;
      justify-content: space-between;
      margin: 1px 0 1.1rem;
      font-size: 10px;
      letter-spacing: .16em;
      color: var(--c-mute);
      font-variant-numeric: tabular-nums;
    }

    /* =========================================================================
       6. BOTÓN "VER TODAS LAS CANCIONES"
       ========================================================================= */
    .list-toggle {
      width: 100%;
      background: transparent;
      border: 1px solid rgba(74, 10, 31, .35);
      color: var(--c-text);
      padding: 11px 18px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .25em;
      text-transform: uppercase;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: background .18s var(--ease), border-color .18s var(--ease);
    }

    .list-toggle:hover {
      background: #4a0a1f14;
      border-color: var(--c-text);
    }

    .list-toggle__chev {
      font-size: 10px;
    }

    /* =========================================================================
       7. PANEL DE CANCIONES (modal que sube desde abajo)
       ========================================================================= */
    .list-panel {
      position: fixed;
      inset: 0;
      z-index: 20;
      pointer-events: none;
      opacity: 0;
      transition: opacity .4s var(--ease);
    }

    .list-panel.is-open {
      opacity: 1;
      pointer-events: auto;
    }

    .list-panel__overlay {
      position: absolute;
      inset: 0;
      background: #2d0a1f59;
    }

    .list-panel__inner {
      position: absolute;
      left: 50%;
      bottom: 4vh;
      transform: translate(-50%) translateY(30px);
      width: min(440px, calc(100vw - 32px));
      max-height: 78vh;
      background: #fffaf8fa;
      border-radius: 26px;
      padding: 18px 16px;
      box-shadow: 0 30px 80px #be185d59;
      display: flex;
      flex-direction: column;
      transition: transform .45s var(--ease-out);
    }

    .list-panel.is-open .list-panel__inner {
      transform: translate(-50%) translateY(0);
    }

    .list-panel__head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 8px 12px;
      border-bottom: 1px solid rgba(190, 24, 93, .1);
    }

    .list-panel__title {
      font-family: "Cormorant Garamond", serif;
      font-style: italic;
      font-weight: 500;
      font-size: 22px;
      margin: 0;
      /* --c-to, no --c-accent: el accent de cada canción es el tono CLARO de su
         paleta y sobre el panel blanco se volvía ilegible (hasta 1.0:1). */
      color: var(--c-to);
    }

    .list-panel__close {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      background: #be185d14;
      color: var(--c-to);
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .list-panel__close:hover {
      background: #be185d2e;
    }

    .list-search {
      width: 100%;
      margin: 12px 4px 4px;
      padding: 10px 16px;
      border: 1px solid rgba(74, 10, 31, .18);
      border-radius: 999px;
      background: #ffffff;
      color: var(--c-ink);
      font-family: inherit;
      font-size: 14px;
      outline: none;
      transition: border-color .18s var(--ease), box-shadow .18s var(--ease);
    }

    .list-search::placeholder {
      color: var(--c-mute);
      font-style: italic;
    }

    .list-search:focus {
      border-color: var(--c-to);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--c-to) 18%, transparent);
    }

    .list-panel__items {
      flex: 1;
      overflow-y: auto;
      padding: 8px 4px;
      scrollbar-width: thin;
      scrollbar-color: var(--c-to) transparent;
    }

    .list-panel__items::-webkit-scrollbar {
      width: 6px;
    }

    .list-panel__items::-webkit-scrollbar-thumb {
      background: color-mix(in srgb, var(--c-to) 45%, transparent);
      border-radius: 999px;
    }

    .list-empty {
      margin: 24px 0 12px;
      text-align: center;
      font-family: "Cormorant Garamond", serif;
      font-style: italic;
      font-size: 18px;
      color: var(--c-mute);
    }

    /* --- fila de la lista --- */
    .list-item {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 12px;
      border-radius: 14px;
      cursor: pointer;
      background: transparent;
      border: none;
      text-align: left;
      color: var(--c-ink);
      transition: background .16s var(--ease);
    }

    .list-item:hover {
      background: #be185d14;
    }

    .list-item[hidden] {
      display: none;
    }

    .list-item.is-active {
      /* mismo motivo: con --c-accent quedaba texto blanco sobre casi-blanco */
      background: var(--c-to);
      color: #fff;
    }

    .list-item.is-active .list-item__artist {
      color: #ffffffbf;
    }

    .list-item__emoji {
      font-size: 24px;
      flex: 0 0 32px;
      text-align: center;
    }

    .list-item__meta {
      min-width: 0;
      flex: 1;
    }

    .list-item__title {
      font-family: "Cormorant Garamond", serif;
      font-style: italic;
      font-size: 17px;
      margin: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.2;
    }

    .list-item__artist {
      font-size: 10px;
      letter-spacing: .18em;
      text-transform: uppercase;
      margin: 2px 0 0;
      color: var(--c-mute);
    }

    .list-item__num {
      font-family: "Cormorant Garamond", serif;
      font-style: italic;
      font-size: 12px;
      opacity: .55;
      flex: 0 0 auto;
    }

    /* =========================================================================
       8. BURBUJAS DE MENSAJES
       ========================================================================= */
    .bubbles {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
    }

    .bubble {
      position: absolute;
      padding: 11px 22px;
      border-radius: 999px;
      background: #fffcfeeb;
      border: 1px solid rgba(74, 10, 31, .18);
      font-family: "Cormorant Garamond", serif;
      font-style: italic;
      font-weight: 600;
      font-size: 19px;
      color: var(--c-text-2);
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      animation: bubbleFloat 9s ease-out forwards;
      will-change: transform, opacity;
      box-shadow: 0 6px 20px -8px #4a0a1f4d;
    }

    /* La capa entera es inerte; solo la burbuja secreta acepta toques.
       Va DESPUÉS de .bubble y con dos clases a propósito: si no, el
       pointer-events:none de .bubble la volvía a desactivar. */
    .bubble.bubble--secret {
      pointer-events: auto;
      cursor: pointer;
      /* Sin esto sale el cursor de texto y al insistir se selecciona la frase:
         parecía texto suelto en vez de algo que se puede tocar. */
      user-select: none;
      -webkit-user-select: none;
      transition: filter .12s var(--ease), box-shadow .12s var(--ease);
    }

    .bubble.bubble--secret:hover {
      box-shadow: 0 8px 26px -8px #4a0a1f66;
    }

    /* Al apretar no se puede tocar transform: lo está usando la animación
       de flotar y la pisaría. El brillo sí es libre. */
    .bubble.bubble--secret:active {
      filter: brightness(.94);
    }

    /* La subida es variable: cuando la burbuja nace debajo de la tarjeta solo
       puede subir hasta rozarla, o volvería a meterse detrás del reproductor. */
    @keyframes bubbleFloat {
      0%   { opacity: 0; transform: translateY(20px); }
      10%  { opacity: 1; }
      90%  { opacity: 1; }
      100% { opacity: 0; transform: translateY(calc(-1 * var(--drift, 100px))); }
    }

    /* =========================================================================
       9. EMOJIS DE AMBIENTE (suben mientras suena la canción)
       ========================================================================= */
    .ambient {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
    }

    .ambient-emoji {
      position: absolute;
      bottom: -40px;
      font-size: 24px;
      opacity: 0;
      animation: ambientRise 9s linear forwards;
      will-change: transform, opacity;
    }

    @keyframes ambientRise {
      0%   { opacity: 0;   transform: translateY(0) rotate(0); }
      15%  { opacity: .85; }
      85%  { opacity: .85; }
      100% { opacity: 0;   transform: translateY(calc(-100vh - 80px)) rotate(20deg); }
    }

    /* =========================================================================
       10. REVEAL — pantalla completa al elegir canción
       ========================================================================= */
    .reveal {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      opacity: 0;
      transition: opacity .5s var(--ease);
    }

    .reveal.is-active {
      opacity: 1;
      pointer-events: auto;
    }

    .reveal__bg {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 50%, var(--c-from) 0%, var(--c-to) 60%, var(--c-accent) 100%);
      opacity: .95;
    }

    /* Velo oscuro justo en el centro. El texto blanco cae sobre --c-from, que es
       el extremo CLARO de la paleta: sin esto no se leía en 35 de las 45. Se
       desvanece hacia los bordes para no matar el color de la canción. */
    .reveal__bg:after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 50%,
        rgba(0, 0, 0, .45) 0%,
        rgba(0, 0, 0, .24) 45%,
        transparent 75%);
    }

    .reveal__inner {
      position: relative;
      text-align: center;
      padding: 0 6vw;
      z-index: 1;
    }

    .reveal__text {
      font-family: "Cormorant Garamond", serif;
      font-style: normal;
      font-weight: 600;
      font-size: min(7.6vw, 118px);
      line-height: 1.1;
      margin: 0;
      color: #fff;
      text-shadow: 0 2px 4px rgba(0, 0, 0, .45), 0 4px 30px rgba(0, 0, 0, .35);
      white-space: nowrap;
      letter-spacing: -.012em;
    }

    .reveal__song {
      margin: 1.6rem 0 0;
      font-family: "Cormorant Garamond", serif;
      font-style: italic;
      font-weight: 500;
      font-size: clamp(20px, 2.6vw, 28px);
      color: #fff;
      text-shadow: 0 1px 3px rgba(0, 0, 0, .5), 0 2px 12px rgba(0, 0, 0, .35);
    }

    .reveal__emojis {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .emoji {
      position: absolute;
      font-size: 34px;
      top: 50%;
      left: 50%;
      opacity: 0;
      animation: emojiFly 2.4s ease-out forwards;
      will-change: transform, opacity;
    }

    @keyframes emojiFly {
      0%   { opacity: 0; transform: translate(-50%, -50%) scale(.4); }
      15%  { opacity: 1; }
      100% { opacity: 0; transform: translate(var(--tx), var(--ty)) rotate(var(--r)) scale(1); }
    }

    /* =========================================================================
       11. FRASCO DE CORAZONES (easter egg)
       Se llena de abajo hacia arriba. Va por encima de la tarjeta y del panel,
       pero por debajo del reveal, y no toca el audio.
       ========================================================================= */
    .jar {
      position: fixed;
      inset: 0;
      z-index: 25;
      pointer-events: none;
      overflow: hidden;
    }

    .jar-emoji {
      position: absolute;
      top: 0;
      left: 0;
      line-height: 1;
      /* Cada uno trae su propia duración y su propio retraso: así llueve en
         desorden en vez de caer todo a la vez. */
      animation: jarCaida var(--dur, 1.5s) var(--delay, 0ms) both;
      will-change: transform;
    }

    /* CAÍDA — acelera como si tirara la gravedad, aterriza, da un botecito
       corto y se asienta. Cada tramo lleva su propia curva. */
    @keyframes jarCaida {
      0% {
        transform: translate(var(--x), -20vh) rotate(var(--r0)) scale(.9);
        animation-timing-function: cubic-bezier(.45, .03, .78, .42);
      }
      70% {
        transform: translate(var(--x), var(--y)) rotate(var(--r)) scale(1);
        animation-timing-function: cubic-bezier(.2, .85, .45, 1);
      }
      82% {
        transform: translate(var(--x), calc(var(--y) - 11px)) rotate(var(--r)) scale(1.03);
        animation-timing-function: cubic-bezier(.55, 0, .8, .5);
      }
      100% {
        transform: translate(var(--x), var(--y)) rotate(var(--r)) scale(1);
      }
    }

    /* VACIADO — como quitarle el fondo al frasco: se desploman fuera de la
       pantalla, los de abajo primero, y los de arriba les siguen. */
    .jar.is-draining .jar-emoji {
      animation: jarSalida .85s var(--salida, 0ms) both;
    }

    @keyframes jarSalida {
      0% {
        transform: translate(var(--x), var(--y)) rotate(var(--r)) scale(1);
        animation-timing-function: cubic-bezier(.5, 0, .85, .5);
      }
      100% {
        transform: translate(calc(var(--x) + var(--dx)), 120vh)
                   rotate(calc(var(--r) + var(--giro))) scale(1);
      }
    }

    /* =========================================================================
       12. ACCESIBILIDAD
       ========================================================================= */
    @media (prefers-reduced-motion: reduce) {
      *,
      *:before,
      *:after {
        animation-duration: 1ms !important;
        transition-duration: 1ms !important;
      }
    }
  </style>
</head>

<body>
  <!-- ======================================================================
       TARJETA PRINCIPAL
       ====================================================================== -->
  <div class="stage">
    <div class="card">
      <p class="card__eyebrow">para ti</p>
      <h1 class="card__title" id="title">Vania, I love you <span class="heart">❤</span></h1>
      <p class="card__sub">hay canciones igual de bajitas que tú</p>

      <!-- NOW PLAYING -->
      <div class="now" id="now">
        <div class="now__cover" id="nowCover">♥</div>
        <p class="now__title" id="nowTitle">elige una canción</p>
        <p class="now__artist" id="nowArtist">— silencio —</p>
      </div>

      <!-- CONTROLES -->
      <div class="player">
        <button class="player__btn" id="prev" aria-label="anterior">‹</button>
        <button class="player__btn player__btn--play" id="play" aria-label="reproducir">▶</button>
        <button class="player__btn" id="next" aria-label="siguiente">›</button>
      </div>
      <div class="player__scrub" id="scrub">
        <div class="player__bar" id="bar">
          <div class="player__fill" id="fill"></div>
        </div>
      </div>
      <div class="player__times">
        <span id="timeNow">0:00</span>
        <span id="timeEnd">0:00</span>
      </div>

      <!-- ABRIR LISTA -->
      <button class="list-toggle" id="listToggle" type="button">
        <span>ver todas las canciones</span>
        <span class="list-toggle__chev" aria-hidden="true">▾</span>
      </button>
    </div>
  </div>

  <!-- ======================================================================
       CAPAS DE FONDO
       ====================================================================== -->
  <div class="bubbles" id="bubbles" aria-hidden="true"></div>
  <div class="ambient" id="ambient" aria-hidden="true"></div>

  <!-- ======================================================================
       PANEL DE CANCIONES
       ====================================================================== -->

    /* =======================================================================
       3. TEMA — vuelca la paleta de la canción en las variables CSS
       ======================================================================= */
    const root = document.documentElement;

    function applyPalette(song) {
      if (!song) return;
      const { from, to, accent, glow } = song.palette;
      root.style.setProperty("--c-from", from);
      root.style.setProperty("--c-to", to);
      root.style.setProperty("--c-accent", accent);
      root.style.setProperty("--c-glow", glow);
    }

    /* =======================================================================
       4. AUDIO — envoltorio del <audio> con listeners propios
       ======================================================================= */
    class AudioPlayer {
      audio;
      current = null;
      state = "idle";
      stateListeners = new Set();
      songListeners = new Set();

      constructor(audio) {
        this.audio = audio;
        audio.addEventListener("play",  () => this.setState("playing"));
        audio.addEventListener("pause", () => this.setState("paused"));
        audio.addEventListener("ended", () => this.setState("paused"));
      }

      async play(song) {
        // Sin argumento = reanudar la actual; con otra canción = cambiar de pista.
        if (song && song.id !== this.current?.id) {
          this.current = song;
          this.audio.src = song.file;
          this.dispatchSong();
        }
        try {
          await this.audio.play();
        } catch {
          // el navegador puede bloquear el autoplay: se ignora
        }
      }

      pause() {
        this.audio.pause();
      }

      toggle() {
        if (!this.current) return;
        if (this.audio.paused) this.play();
        else this.pause();
      }

      seek(ratio) {
        if (Number.isFinite(this.audio.duration)) {
          this.audio.currentTime = ratio * this.audio.duration;
        }
      }

      /* --- suscripciones (devuelven una función para desuscribirse) --- */
      onState(fn) {
        this.stateListeners.add(fn);
        return () => this.stateListeners.delete(fn);
      }

      onSong(fn) {
        this.songListeners.add(fn);
        return () => this.songListeners.delete(fn);
      }

      onEnded(fn) {
        this.audio.addEventListener("ended", fn);
        return () => this.audio.removeEventListener("ended", fn);
      }

      /* --- emisión --- */
      setState(next) {
        if (this.state === next) return;
        this.state = next;
        this.stateListeners.forEach((fn) => fn(next));
      }

      dispatchSong() {
        this.songListeners.forEach((fn) => fn(this.current));
      }
    }

    /* =======================================================================
       5. REVEAL — momento a pantalla completa al elegir una canción
       ======================================================================= */
    const REVEAL_TEXT     = "iloveyoualotsoverymuch";
    const REVEAL_TYPE_MS  = 70;    // ms por letra
    const REVEAL_HIDE_MS  = 3400;  // se cierra solo
    const REVEAL_EMOJIS   = 36;    // emojis que salen disparados

    class Reveal {
      el         = document.getElementById("reveal");
      text       = document.getElementById("revealText");
      songLabel  = document.getElementById("revealSong");
      emojiLayer = document.getElementById("revealEmojis");
      typeTimer;
      hideTimer;

      constructor() {
        this.el.addEventListener("click", () => this.hide());
      }

      show(song) {
        window.clearTimeout(this.typeTimer);
        window.clearTimeout(this.hideTimer);

        this.text.textContent = "";
        this.songLabel.textContent =
          song.artist === "—" ? song.title : `${song.title} · ${song.artist}`;
        this.emojiLayer.innerHTML = "";
        this.el.classList.add("is-active");
        this.el.setAttribute("aria-hidden", "false");

        // máquina de escribir
        let i = 0;
        const type = () => {
          this.text.textContent = REVEAL_TEXT.slice(0, i + 1);
          i++;
          if (i < REVEAL_TEXT.length) {
            this.typeTimer = window.setTimeout(type, REVEAL_TYPE_MS);
          }
        };
        type();

        // explosión radial de emojis
        for (let n = 0; n < REVEAL_EMOJIS; n++) {
          const el = document.createElement("span");
          el.className = "emoji";
          el.textContent = song.emojis[n % song.emojis.length] ?? "✨";

          const angle = (n / REVEAL_EMOJIS) * Math.PI * 2 + Math.random() * 0.4;
          const dist  = 200 + Math.random() * 220;

          el.style.setProperty("--tx", `${Math.cos(angle) * dist - 18}px`);
          el.style.setProperty("--ty", `${Math.sin(angle) * dist - 18}px`);
          el.style.setProperty("--r",  `${(Math.random() - 0.5) * 720}deg`);
          el.style.animationDelay = `${Math.random() * 0.25}s`;

          this.emojiLayer.appendChild(el);
        }

        this.hideTimer = window.setTimeout(() => this.hide(), REVEAL_HIDE_MS);
      }

      hide() {
        this.el.classList.remove("is-active");
        this.el.setAttribute("aria-hidden", "true");
        window.clearTimeout(this.typeTimer);
        window.clearTimeout(this.hideTimer);
      }
    }

      itemsEl.innerHTML = SONGS.map((song, i) => `
        <button class="list-item" data-id="${song.id}" type="button">
          <span class="list-item__emoji" aria-hidden="true">${song.emojis[0] ?? "❤"}</span>
          <div class="list-item__meta">
            <p class="list-item__title">${song.title}</p>
            <p class="list-item__artist">${song.artist}</p>
          </div>
          <span class="list-item__num">${String(i + 1).padStart(2, "0")}</span>
        </button>
      `).join("");

      const items = Array.from(itemsEl.querySelectorAll(".list-item"));

      function markActive(id) {
        for (const el of items) {
          el.classList.toggle("is-active", el.dataset.id === id);
        }
      }

      function renderNowPlaying(song) {
        if (!song) {
          coverEl.textContent  = "♥";
          titleEl.textContent  = "elige una canción";
          artistEl.textContent = "— silencio —";
          return;
        }
        coverEl.textContent  = song.emojis[0] ?? "❤";
        titleEl.textContent  = song.title;
        artistEl.textContent = song.artist;
      }

      function selectSong(song) {
        applyPalette(song);
        markActive(song.id);
        renderNowPlaying(song);
        reveal.show(song);
        player.play(song);
        closePanel();
      }

      items.forEach((el) => {
        el.addEventListener("click", () => {
          const song = SONGS.find((s) => s.id === el.dataset.id);
          if (song) selectSong(song);
        });
      });

      player.onState((state) => {
        nowEl.classList.toggle("is-playing", state === "playing");
      });

      /* --- buscador: filtra por título y por artista --- */
      function filtrar() {
        const q = searchEl.value.trim().toLowerCase();
        let visibles = 0;
        items.forEach((el, i) => {
          const s = SONGS[i];
          const hit = !q ||
            s.title.toLowerCase().includes(q) ||
            s.artist.toLowerCase().includes(q);
          el.hidden = !hit;
          if (hit) visibles++;
        });
        emptyEl.hidden = visibles > 0;
      }

      searchEl.addEventListener("input", filtrar);

      /* --- abrir / cerrar el panel --- */
      function openPanel() {
        panel.classList.add("is-open");
        panel.setAttribute("aria-hidden", "false");
        itemsEl.querySelector(".list-item.is-active")?.scrollIntoView({ block: "center" });
      }

      function closePanel() {
        panel.classList.remove("is-open");
        panel.setAttribute("aria-hidden", "true");
        searchEl.value = "";
        filtrar();
      }

      toggleBtn.addEventListener("click", openPanel);
      overlay.addEventListener("click", closePanel);
      closeBtn.addEventListener("click", closePanel);
      document.addEventListener("keydown", (e) => {
        if (e.key !== "Escape" || !panel.classList.contains("is-open")) return;
        // Escape limpia el buscador primero; solo cierra si ya estaba vacío.
        if (searchEl.value) { searchEl.value = ""; filtrar(); return; }
        closePanel();
      });

      return {
        setActive(id) {
          const song = SONGS.find((s) => s.id === id);
          if (!song) return;
          applyPalette(song);
          markActive(id);
          renderNowPlaying(song);
        },
        /* Cambiar de pista sin pasar por el reveal: lo usan los botones, el
           teclado, el fin de canción y los controles del móvil. */
        go(song) {
          if (!song) return;
          applyPalette(song);
          markActive(song.id);
          renderNowPlaying(song);
          player.play(song);
        },
        nextOf(id) {
          const i = SONGS.findIndex((s) => s.id === id);
          return SONGS[(i + 1) % SONGS.length];
        },
        prevOf(id) {
          const i = SONGS.findIndex((s) => s.id === id);
          return SONGS[(i - 1 + SONGS.length) % SONGS.length];
        },
      };
    }

    /* =======================================================================
       7. CONTROLES — play/pausa, anterior/siguiente, barra de progreso
       ======================================================================= */
    function setupControls(player, list) {
      const playBtn = document.getElementById("play");
      const prevBtn = document.getElementById("prev");
      const nextBtn = document.getElementById("next");
      const barEl   = document.getElementById("bar");
      const fillEl  = document.getElementById("fill");

      if (!playBtn) return;

      // El icono del botón sigue al estado real del <audio>.
      player.onState((state) => {
        playBtn.textContent = state === "playing" ? "❚❚" : "▶";
        playBtn.setAttribute("aria-label", state === "playing" ? "pausar" : "reproducir");
      });

      playBtn.addEventListener("click", () => {
        if (player.current) player.toggle();
      });

      prevBtn.addEventListener("click", () => {
        if (!player.current) return;
        list.go(list.prevOf(player.current.id));
      });

      nextBtn.addEventListener("click", () => {
        if (!player.current) return;
        list.go(list.nextOf(player.current.id));
      });

      player.onEnded(() => {
        if (!player.current) return;
        list.go(list.nextOf(player.current.id));
      });

      /* --- barra de progreso: arrastrable, con tiempos --- */
      const scrubEl = document.getElementById("scrub");
      const nowT    = document.getElementById("timeNow");
      const endT    = document.getElementById("timeEnd");
      let arrastrando = false;

      const mmss = (s) => Number.isFinite(s) && s >= 0
        ? `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`
        : "0:00";

      const ratioDe = (e) => {
        const r = barEl.getBoundingClientRect();
        return Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
      };

      const pintar = (ratio, t) => {
        fillEl.style.width = `${ratio * 100}%`;
        nowT.textContent = mmss(t);
      };

      player.audio.addEventListener("timeupdate", () => {
        if (arrastrando) return;   // mientras se arrastra manda el dedo
        const { currentTime, duration } = player.audio;
        if (!Number.isFinite(duration) || duration === 0) return;
        pintar(currentTime / duration, currentTime);
      });

      player.audio.addEventListener("loadedmetadata", () => {
        endT.textContent = mmss(player.audio.duration);
      });

      player.onSong(() => {
        fillEl.style.width = "0%";
        nowT.textContent = "0:00";
        endT.textContent = "0:00";
      });

      scrubEl.addEventListener("pointerdown", (e) => {
        if (!player.current || !Number.isFinite(player.audio.duration)) return;
        arrastrando = true;
        scrubEl.classList.add("is-scrubbing");
        scrubEl.setPointerCapture(e.pointerId);
        const r = ratioDe(e);
        pintar(r, r * player.audio.duration);
      });

      scrubEl.addEventListener("pointermove", (e) => {
        if (!arrastrando) return;
        const r = ratioDe(e);
        pintar(r, r * player.audio.duration);
      });

      const soltar = (e) => {
        if (!arrastrando) return;
        arrastrando = false;
        scrubEl.classList.remove("is-scrubbing");
        try { scrubEl.releasePointerCapture(e.pointerId); } catch {}
        player.seek(ratioDe(e));
      };

      scrubEl.addEventListener("pointerup", soltar);
      scrubEl.addEventListener("pointercancel", soltar);
    }

    /* =======================================================================
       8. EFECTO — burbujas de mensajes (siempre activas)
       ======================================================================= */
    const BUBBLE_MAX      = 7;
    const BUBBLE_EVERY_MS = 1800;
    const BUBBLE_LIFE_MS  = 9000;
    const BUBBLE_DRIFT    = 100;             // lo que sube durante bubbleFloat
    const BUBBLE_ARRANQUE = 20;              // y lo que baja al empezar
    const SECRET_MESSAGE  = "Vania bajita 👑";
    const SECRET_TAPS     = 3;

    function setupBubbles(alTocarSecreto) {
      const layer = document.getElementById("bubbles");
      if (!layer) return;

      const card  = document.querySelector(".card");
      const alive = new Set();
      let toques = 0;                        // se acumulan entre burbujas

      /* Antes nacían entre 10–80vw y 15–85vh, o sea encima del centro, y la
         tarjeta las tapaba (capa en z-index 1, tarjeta en 2). Ahora se sortea
         la posición solo en el hueco libre alrededor de la tarjeta. */
      function huecoLibre(w, h) {
        const vw = innerWidth, vh = innerHeight, pad = 14;
        const r = card?.getBoundingClientRect();
        const alto = h + BUBBLE_ARRANQUE;    // ocupa un poco más al arrancar
        const zonas = [];
        const add = (x0, y0, x1, y1, drift) => {
          if (x1 > x0 && y1 > y0) zonas.push({ x0, y0, x1, y1, drift, area: (x1 - x0) * (y1 - y0) });
        };

        if (!r) {
          add(0, 0, vw - w, vh - alto, BUBBLE_DRIFT);
        } else {
          // A los lados y por arriba sube entera sin acercarse a la tarjeta.
          add(0, 0, r.left - pad - w, vh - alto, BUBBLE_DRIFT);        // izquierda
          add(r.right + pad, 0, vw - w, vh - alto, BUBBLE_DRIFT);      // derecha
          add(0, 0, vw - w, r.top - pad - alto, BUBBLE_DRIFT);         // arriba
          // Por abajo la subida se recorta según lo lejos que haya nacido.
          add(0, r.bottom + pad + 25, vw - w, vh - alto, null);        // abajo
        }

        // Pantalla sin hueco: mejor no sacar burbuja que sacarla tapada.
        if (!zonas.length) return null;

        // Zona al azar, ponderada por área, para repartir parejo.
        let n = Math.random() * zonas.reduce((s, z) => s + z.area, 0);
        const z = zonas.find((z) => (n -= z.area) <= 0) ?? zonas[0];
        const y = z.y0 + Math.random() * (z.y1 - z.y0);

        return {
          x: z.x0 + Math.random() * (z.x1 - z.x0),
          y,
          drift: z.drift ?? Math.min(BUBBLE_DRIFT, y - r.bottom - pad),
        };
      }

      function spawn() {
        if (alive.size >= BUBBLE_MAX || document.hidden) return;

        const msg = MESSAGES[Math.floor(Math.random() * MESSAGES.length)] ?? "";
        const el = document.createElement("div");
        el.className = "bubble";
        el.textContent = msg;
        el.style.left = "-9999px";           // fuera de vista para poder medirla
        layer.appendChild(el);

        const hueco = huecoLibre(el.offsetWidth, el.offsetHeight);
        if (!hueco) { el.remove(); return; }
        el.style.left = `${hueco.x}px`;
        el.style.top  = `${hueco.y}px`;
        el.style.setProperty("--drift", `${hueco.drift}px`);

        if (msg === SECRET_MESSAGE) {
          el.classList.add("bubble--secret");
          // pointerdown y no click: la burbuja se mueve mientras vive y en
          // móvil el click puede perderse entre el toque y el levantar el dedo.
          el.addEventListener("pointerdown", () => {
            if (++toques < SECRET_TAPS) return;
            toques = 0;
            alTocarSecreto?.();
          });
        }

        alive.add(el);
        setTimeout(() => {
          alive.delete(el);
          el.remove();
        }, BUBBLE_LIFE_MS);
      }

      setInterval(spawn, BUBBLE_EVERY_MS);
      setTimeout(spawn, 800);
    }

    /* =======================================================================
       9. EFECTO — emojis de ambiente (solo mientras suena algo)
       ======================================================================= */
    const AMBIENT_EVERY_MS = 600;
    const AMBIENT_LIFE_MS  = 9500;

    function setupAmbient(player) {
      const layer = document.getElementById("ambient");
      if (!layer) return;

      let emojis = ["❤"];
      let timer;
      let isPlaying = false;

      player.onSong((song) => {
        emojis = song?.emojis.length ? song.emojis : ["❤"];
      });

      player.onState((state) => {
        const was = isPlaying;
        isPlaying = state === "playing";
        if (isPlaying && !was) start();
        if (!isPlaying && was) stop();
      });

      function spawn() {
        if (!isPlaying || document.hidden) return;

        const el = document.createElement("div");
        el.className = "ambient-emoji";
        el.textContent = emojis[Math.floor(Math.random() * emojis.length)] ?? "❤";
        el.style.left              = `${5 + Math.random() * 90}vw`;
        el.style.fontSize          = `${20 + Math.random() * 14}px`;
        el.style.animationDuration = `${8 + Math.random() * 4}s`;

        layer.appendChild(el);
        window.setTimeout(() => el.remove(), AMBIENT_LIFE_MS);
      }

      function start() {
        if (timer) return;
        spawn();
        timer = window.setInterval(spawn, AMBIENT_EVERY_MS);
      }

      function stop() {
        if (timer) window.clearInterval(timer);
        timer = undefined;
      }
    }

    /* =======================================================================
       10. EASTER EGG — el frasco de corazones
       Se dispara con 3 toques acumulados en la burbuja "Vania bajita 👑".
       No toca el audio ni la paleta: la canción sigue exactamente igual.
       ======================================================================= */
    const JAR_CORAZONES = ["❤️", "💗", "💖", "💓", "💕", "💘", "💝", "❣️", "🩷", "♥️"];
    const JAR_ESTRELLAS = ["⭐", "🌟", "✨", "💫", "🌠"];
    const JAR_OTROS     = ["🧡", "💛", "💚", "💙", "💜", "🤍"];
    const JAR_LLENADO_MS = 7000;   // lo que tarda la lluvia en cubrir la pantalla
    const JAR_ESPERA_MS  = 1400;   // lo que se queda quieta una vez llena
    const JAR_TOPE       = 420;    // máximo de emojis a la vez

    function jarBurst() {
      const layer = document.getElementById("jar");
      if (!layer || layer.dataset.lleno === "1") return;   // sin solaparse consigo mismo
      layer.dataset.lleno = "1";
      layer.classList.remove("is-draining");
      layer.innerHTML = "";

      // Mayoría rojos y rosas, luego estrellas, y el resto de colores al final.
      const elegir = () => {
        const r = Math.random();
        const pool = r < 0.62 ? JAR_CORAZONES : r < 0.82 ? JAR_ESTRELLAS : JAR_OTROS;
        return pool[Math.floor(Math.random() * pool.length)];
      };

      // La celda crece en pantallas grandes para que la pantalla quede cubierta
      // del todo sin pasarse del tope de emojis.
      const vw = innerWidth, vh = innerHeight;
      let celda = 56;
      while (Math.ceil(vw / celda) * Math.ceil(vh / celda) > JAR_TOPE) celda += 4;

      // +1 columna porque las filas impares van desplazadas media celda.
      const cols  = Math.ceil(vw / celda) + 1;
      const filas = Math.ceil(vh / celda);

      const huecos = [];
      for (let fila = 0; fila < filas; fila++)
        for (let col = 0; col < cols; col++)
          // El desempate al azar difumina la frontera entre filas: el montón
          // sube irregular, como canicas de verdad, no en capas planas.
          huecos.push({ fila, col, orden: fila + Math.random() * 0.85 });

      huecos.sort((a, b) => a.orden - b.orden);

      // Mismo tiempo total en un móvil (~110 huecos) que en un escritorio (~420).
      const intervalo = Math.min(90, Math.max(12, JAR_LLENADO_MS / huecos.length));
      let ultimoAterrizaje = 0;

      huecos.forEach(({ fila, col }, i) => {
        const el = document.createElement("span");
        el.className = "jar-emoji";
        el.textContent = elegir();

        // Al tresbolillo: las filas impares van media celda corridas, como
        // ladrillos. Tapa mucho mejor que una rejilla recta y encima se nota
        // menos que hay rejilla debajo.
        const sangria = (fila % 2) * celda * 0.5;
        const x = col * celda - celda * 0.5 + sangria + (Math.random() - 0.5) * celda * 0.24;
        const y = vh - (fila + 1) * celda + (Math.random() - 0.5) * celda * 0.2;
        el.style.setProperty("--x",  `${x}px`);
        el.style.setProperty("--y",  `${y}px`);
        el.style.setProperty("--r0", `${(Math.random() - 0.5) * 120}deg`);
        el.style.setProperty("--r",  `${(Math.random() - 0.5) * 70}deg`);
        // Más grandes que la celda a propósito: se solapan y no quedan huecos.
        el.style.fontSize = `${celda * (1.02 + Math.random() * 0.32)}px`;

        // Cada uno cae a su ritmo, así que siempre hay muchos en el aire.
        const dur    = 1.2 + Math.random() * 0.7;
        const salida = i * intervalo;
        el.style.setProperty("--dur",   `${dur}s`);
        el.style.setProperty("--delay", `${salida}ms`);

        // Para el vaciado: los de abajo se van primero, con algo de deriva.
        el.style.setProperty("--salida", `${fila * 38 + Math.random() * 60}ms`);
        el.style.setProperty("--dx",     `${(Math.random() - 0.5) * 90}px`);
        el.style.setProperty("--giro",   `${(Math.random() - 0.5) * 260}deg`);

        ultimoAterrizaje = Math.max(ultimoAterrizaje, salida + dur * 1000);
        layer.appendChild(el);
      });

      const vaciar = ultimoAterrizaje + JAR_ESPERA_MS;
      const finVaciado = filas * 38 + 60 + 850;

      setTimeout(() => layer.classList.add("is-draining"), vaciar);
      setTimeout(() => {
        layer.classList.remove("is-draining");
        layer.innerHTML = "";
        layer.dataset.lleno = "0";
      }, vaciar + finVaciado + 120);
    }

    /* =======================================================================
       11. CONTROLES DEL MÓVIL — pantalla de bloqueo y notificación
       ======================================================================= */
    function setupMediaSession(player, list) {
      if (!("mediaSession" in navigator)) return;
      const ms = navigator.mediaSession;

      // Portada: el emoji de la canción sobre su propio degradado.
      function portada(song) {
        try {
          const c = document.createElement("canvas");
          c.width = c.height = 512;
          const g = c.getContext("2d");
          const grad = g.createLinearGradient(0, 0, 512, 512);
          grad.addColorStop(0, song.palette.from);
          grad.addColorStop(1, song.palette.to);
          g.fillStyle = grad;
          g.fillRect(0, 0, 512, 512);
          g.font = "300px serif";
          g.textAlign = "center";
          g.textBaseline = "middle";
          g.fillText(song.emojis[0] ?? "❤", 256, 282);
          return [{ src: c.toDataURL("image/png"), sizes: "512x512", type: "image/png" }];
        } catch {
          return [];
        }
      }

      player.onSong((song) => {
        if (!song) return;
        ms.metadata = new MediaMetadata({
          title: song.title,
          artist: song.artist === "—" ? "" : song.artist,
          album: "Vania Bajita ❤️",
          artwork: portada(song),
        });
      });

      player.onState((state) => {
        ms.playbackState = state === "playing" ? "playing" : "paused";
      });

      const accion = (nombre, fn) => { try { ms.setActionHandler(nombre, fn); } catch {} };
      const saltar = (s) => {
        const { duration, currentTime } = player.audio;
        if (!Number.isFinite(duration)) return;
        player.audio.currentTime = Math.max(0, Math.min(duration, currentTime + s));
      };

      accion("play",  () => player.play());
      accion("pause", () => player.pause());
      accion("previoustrack", () => player.current && list.go(list.prevOf(player.current.id)));
      accion("nexttrack",     () => player.current && list.go(list.nextOf(player.current.id)));
      accion("seekbackward", (d) => saltar(-(d?.seekOffset ?? 10)));
      accion("seekforward",  (d) => saltar(d?.seekOffset ?? 10));
      accion("seekto", (d) => {
        if (d?.seekTime != null) player.audio.currentTime = d.seekTime;
      });
    }

    /* =======================================================================
       12. TECLADO
       ======================================================================= */
    function setupKeyboard(player, list) {
      document.addEventListener("keydown", (e) => {
        // No secuestrar las teclas mientras se escribe en el buscador.
        const t = e.target;
        if (t instanceof HTMLInputElement || t instanceof HTMLTextAreaElement) return;
        if (e.metaKey || e.ctrlKey || e.altKey) return;

        const saltar = (s) => {
          const { duration, currentTime } = player.audio;
          if (!Number.isFinite(duration)) return;
          player.audio.currentTime = Math.max(0, Math.min(duration, currentTime + s));
        };

        switch (e.key) {
          case " ":
          case "k":
          case "K":
            if (!player.current) return;
            e.preventDefault();
            player.toggle();
            break;
          case "ArrowRight": e.preventDefault(); saltar(10);  break;
          case "ArrowLeft":  e.preventDefault(); saltar(-10); break;
          case "ArrowDown":
            if (!player.current) return;
            e.preventDefault();
            list.go(list.nextOf(player.current.id));
            break;
          case "ArrowUp":
            if (!player.current) return;
            e.preventDefault();
            list.go(list.prevOf(player.current.id));
            break;
        }
      });
    }

    /* =======================================================================
       13. ARRANQUE
       ======================================================================= */
    function typeInto(el, text, speed = 65) {
      el.textContent = "";
      let i = 0;
      const step = () => {
        el.textContent = text.slice(0, i + 1);
        i++;
        if (i < text.length) window.setTimeout(step, speed);
      };
      step();
    }

    function init() {
      const audio  = document.getElementById("audio");
      const player = new AudioPlayer(audio);
      const reveal = new Reveal();
      const list   = setupSongList(player, reveal);

      setupControls(player, list);
      setupBubbles(jarBurst);
      setupAmbient(player);
      setupMediaSession(player, list);
      setupKeyboard(player, list);

      // El título de la tarjeta se reescribe cada vez que cambia la canción.
      const titleEl = document.getElementById("title");
      player.onSong((song) => {
        if (!song || !titleEl) return;
        typeInto(titleEl, "iloveyoualotsoverymuch");
      });
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", init);
    } else {
      init();
    }
  </script>
</body>
</html>
