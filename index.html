:var(--c-mute)}.list-item__num{font-family:Cormorant Garamond,serif;font-style:italic;font-size:12px;opacity:.55;flex:0 0 auto}.bubbles{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}.bubble{position:absolute;padding:11px 22px;border-radius:999px;background:#fffcfeeb;border:1px solid rgba(74,10,31,.18);font-family:Cormorant Garamond,serif;font-style:italic;font-weight:600;font-size:19px;color:var(--c-text-2);white-space:nowrap;pointer-events:none;opacity:0;animation:bubbleFloat 9s ease-out forwards;will-change:transform,opacity;box-shadow:0 6px 20px -8px #4a0a1f4d}@keyframes bubbleFloat{0%{opacity:0;transform:translateY(20px)}10%{opacity:1}90%{opacity:1}to{opacity:0;transform:translateY(-100px)}}.ambient{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}.ambient-emoji{position:absolute;bottom:-40px;font-size:24px;opacity:0;animation:ambientRise 9s linear forwards;will-change:transform,opacity}@keyframes ambientRise{0%{opacity:0;transform:translateY(0) rotate(0)}15%{opacity:.85}85%{opacity:.85}to{opacity:0;transform:translateY(calc(-100vh - 80px)) rotate(20deg)}}.reveal{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity .5s var(--ease)}.reveal.is-active{opacity:1;pointer-events:auto}.reveal__bg{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,var(--c-from) 0%,var(--c-to) 60%,var(--c-accent) 100%);opacity:.95}.reveal__inner{position:relative;text-align:center;padding:0 6vw;z-index:1}.reveal__text{font-family:Cormorant Garamond,serif;font-style:normal;font-weight:600;font-size:min(7.6vw,118px);line-height:1.1;margin:0;color:#fff;text-shadow:0 4px 30px rgba(0,0,0,.25);white-space:nowrap;letter-spacing:-.012em}.reveal__song{margin:1.6rem 0 0;font-family:Cormorant Garamond,serif;font-style:italic;font-weight:500;font-size:clamp(20px,2.6vw,28px);color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.3)}.reveal__emojis{position:absolute;inset:0;pointer-events:none;overflow:hidden}.emoji{position:absolute;font-size:34px;top:50%;left:50%;opacity:0;animation:emojiFly 2.4s ease-out forwards;will-change:transform,opacity}@keyframes emojiFly{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}15%{opacity:1}to{opacity:0;transform:translate(var(--tx),var(--ty)) rotate(var(--r)) scale(1)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:1ms!important;transition-duration:1ms!important}}</style>
  </head>
  <body>
    <div class="stage">
      <div class="card">
        <p class="card__eyebrow">para ti</p>
        <h1 class="card__title" id="title">Vania, I love you <span class="heart">❤</span></h1>
        <p class="card__sub">hay canciones igual de bajitas que tú</p>

        <!-- NOW PLAYING — focal display -->
        <div class="now" id="now">
          <div class="now__cover" id="nowCover">♥</div>
          <p class="now__title" id="nowTitle">elige una canción</p>
          <p class="now__artist" id="nowArtist">— silencio —</p>
        </div>

        <!-- CONTROLS -->
        <div class="player">
          <button class="player__btn" id="prev" aria-label="anterior">‹</button>
          <button class="player__btn player__btn--play" id="play" aria-label="reproducir">▶</button>
          <button class="player__btn" id="next" aria-label="siguiente">›</button>
        </div>
        <div class="player__bar" id="bar"><div class="player__fill" id="fill"></div></div>

        <!-- LIST OPENER -->
        <button class="list-toggle" id="listToggle" type="button">
          <span>ver todas las canciones</span>
          <span class="list-toggle__chev" aria-hidden="true">▾</span>
        </button>
      </div>
    </div>

    <!-- BUBBLES (love messages) -->
    <div class="bubbles" id="bubbles" aria-hidden="true"></div>

    <!-- AMBIENT EMOJIS (persist while a song plays) -->
    <div class="ambient" id="ambient" aria-hidden="true"></div>

    <!-- SONG LIST PANEL (slide-up modal) -->
    <div class="list-panel" id="listPanel" aria-hidden="true">
      <div class="list-panel__overlay" id="listOverlay"></div>
      <div class="list-panel__inner" role="dialog" aria-label="canciones">
        <header class="list-panel__head">
          <h2 class="list-panel__title">elige una</h2>
          <button class="list-panel__close" id="listClose" aria-label="cerrar">✕</button>
        </header>
        <div class="list-panel__items" id="listItems"></div>
      </div>
    </div>

    <!-- BIG REVEAL — full-screen moment on song click -->
    <div class="reveal" id="reveal" aria-hidden="true">
      <div class="reveal__bg"></div>
      <div class="reveal__inner">
        <p class="reveal__text" id="revealText"></p>
        <p class="reveal__song" id="revealSong"></p>
      </div>
      <div class="reveal__emojis" id="revealEmojis"></div>
    </div>

    <audio id="audio" preload="metadata"></audio>

  </body>
</html>
